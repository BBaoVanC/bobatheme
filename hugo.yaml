markup:
  highlight:
    noClasses: false
    lineNos: true
  goldmark:
    parser:
      attribute:
        block: true
        # this is enabled by default already
        #title: true

params:
  readingtime: true

taxonomies:
  category: categories
  tag: tags
  author: authors
  series: series

outputs:
  page:
    - html
  home:
    - html
    - rss
    - REDIR

outputFormats:
  # https://honnef.co/articles/generating-netlify-_redirects-from-hugo/
  REDIR:
    mediaType: text/caddy
    baseName: _redirects
    isPlainText: true
    notAlternative: true

mediaTypes:
  # https://honnef.co/articles/generating-netlify-_redirects-from-hugo/
  text/caddy:
    delimeter: ""

privacy:
  googleAnalytics:
    disable: true

  x:
    enableDNT: true

  vimeo:
    enableDNT: true

  youtube:
    privacyEnhanced: true
